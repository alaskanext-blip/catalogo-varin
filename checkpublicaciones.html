<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Semáforo de Publicaciones</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; padding: 40px; background: #f4f4f4; }
  h1 { color: #333; }
  #ejecutar { padding: 12px 30px; font-size: 16px; cursor: pointer; border-radius: 8px; border: none; background: #2196F3; color: white; }
  #resultado { margin-top: 30px; font-size: 22px; padding: 20px; border-radius: 10px; }
  .verde { background: #C8E6C9; color: #2E7D32; }
  .rojo { background: #FFCDD2; color: #C62828; }
</style>
</head>
<body>
  <h1>🚦 Revisor de Publicaciones</h1>
  <button id="ejecutar">Ejecutar</button>
  <div id="resultado"></div>

<script>
document.getElementById('ejecutar').addEventListener('click', () => {
  // Datos de ejemplo (simulación de una revisión)
  const problemas = []; // vacío = todo bien; agrega URLs para ver el estado rojo

  const div = document.getElementById('resultado');
  if (problemas.length === 0) {
    div.className = "verde";
    div.innerHTML = "🟢 Tranki Todo Bien!";
  } else {
    div.className = "rojo";
    div.innerHTML = "🔴 Problemas detectados:<br>" + problemas.join("<br>");
  }
});
</script>
</body>
</html>
