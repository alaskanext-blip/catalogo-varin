<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajustes de Píxeles e Imagen</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }
        h2 {
            color: #0056b3;
            margin-top: 0;
        }
        .section {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="file"], input[type="number"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .checkbox-group input {
            width: auto;
            margin-right: 10px;
        }
        button {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        button:hover {
            background-color: #004494;
        }
        .preview {
            margin-top: 20px;
            text-align: center;
        }
        canvas {
            max-width: 100%;
            height: auto;
            border: 1px dashed #ccc;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Herramienta: Ajustes de Píxeles</h2>
    
    <div class="section">
        <label for="uploadImage">Cargar Imagen:</label>
        <input type="file" id="uploadImage" accept="image/*">
    </div>

    <div class="section">
        <label for="maxWidth">Ancho Máximo / Específico (px):</label>
        <input type="number" id="maxWidth" value="2000">

        <label for="maxHeight">Alto Máximo / Específico (px):</label>
        <input type="number" id="maxHeight" value="2000">

        <div class="checkbox-group">
            <input type="checkbox" id="maintainAspectRatio" checked>
            <label for="maintainAspectRatio" style="margin-bottom:0;">Mantener proporción original</label>
        </div>
    </div>

    <button id="processBtn">Procesar y Ajustar Píxeles</button>

    <div class="preview" id="previewSection" style="display:none;">
        <h3>Resultado:</h3>
        <canvas id="outputCanvas"></canvas>
        <br><br>
        <a id="downloadLink" download="imagen_ajustada.png">
            <button style="background-color: #28a745;">Descargar Imagen</button>
        </a>
    </div>
</div>

<script>
    const uploadImage = document.getElementById('uploadImage');
    const maxWidthInput = document.getElementById('maxWidth');
    const maxHeightInput = document.getElementById('maxHeight');
    const maintainAspectRatio = document.getElementById('maintainAspectRatio');
    const processBtn = document.getElementById('processBtn');
    const previewSection = document.getElementById('previewSection');
    const outputCanvas = document.getElementById('outputCanvas');
    const downloadLink = document.getElementById('downloadLink');

    let loadedImage = new Image();

    uploadImage.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                loadedImage.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }
    });

    processBtn.addEventListener('click', () => {
        if (!loadedImage.src) {
            alert('Por favor, carga una imagen primero.');
            return;
        }

        let targetWidth = parseInt(maxWidthInput.value) || 2000;
        let targetHeight = parseInt(maxHeightInput.value) || 2000;
        let originalWidth = loadedImage.width;
        let originalHeight = loadedImage.height;

        if (maintainAspectRatio.checked) {
            let ratio = Math.min(targetWidth / originalWidth, targetHeight / originalHeight);
            targetWidth = Math.round(originalWidth * ratio);
            targetHeight = Math.round(originalHeight * ratio);
        }

        outputCanvas.width = targetWidth;
        outputCanvas.height = targetHeight;

        const ctx = outputCanvas.getContext('2d');
        ctx.clearRect(0, 0, targetWidth, targetHeight);
        ctx.drawImage(loadedImage, 0, 0, targetWidth, targetHeight);

        previewSection.style.display = 'block';
        downloadLink.href = outputCanvas.toDataURL('image/png');
    });
</script>

</body>
</html>
